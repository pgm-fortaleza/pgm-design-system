image: $IMAGES_REGISTRY/cypress-base:18.16.0

stages:
  - build
  - release

build:
  stage: build
  image: $IMAGES_REGISTRY/node:24-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    name: "pgm-design-system-$CI_COMMIT_SHORT_SHA"
    expose_as: "Catalogo de paletas"
    paths:
      - dist/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

storybook:
  stage: build
  image: $IMAGES_REGISTRY/node:24-alpine
  script:
    - npm ci
    - npm run build-storybook
    - npm run typecheck
  artifacts:
    name: "pgm-design-system-storybook-$CI_COMMIT_SHORT_SHA"
    expose_as: "Storybook"
    paths:
      - storybook-static/
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: release
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_TOKEN
      when: manual
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - REMOTE="https://release:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git ls-remote --exit-code --tags "$REMOTE" "refs/tags/v$VERSION" >/dev/null; then
        echo "A versão v$VERSION já existe. Rode npm run version no MR antes de liberar."
        exit 1
      fi
    - git config user.name "PGM Design System"
    - git config user.email "pgm-design-system@noreply.gitlab.fortaleza.ce.gov.br"
    - git checkout -B release
    - git add -f dist/tokens
    - git commit -m "Release v$VERSION"
    - git tag "v$VERSION"
    - git push --force "$REMOTE" HEAD:refs/heads/release
    - git push "$REMOTE" "refs/tags/v$VERSION"
